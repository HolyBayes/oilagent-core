[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oilagent"
version = "0.1.0"
description = "Oil analyst: LangGraph core and bounded evolution MCP integration prototype"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "langgraph==1.2.19",
  "langchain-openai==1.7.3",
  "langchain-gigachat==0.5.1",
  "python-dotenv==1.2.4",
  "pymupdf==1.28.2",
  "chromadb==1.5.9",
  "sentence-transformers==5.7.0",
  "ddgs==9.16.1",
  "statsmodels==0.15.0",
  "pandas==3.1.0",
  "xlrd==2.0.2",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analyst = ["seeds/*/SKILL.md", "seeds/web_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
