x-model-environment: &model-environment
  LLM_PROVIDER: ${LLM_PROVIDER:-gigachat}
  LLM_LOCK_PATH: /provider-lock/gigachat.lock
  REQUEST_TIMEOUT_SEC: ${REQUEST_TIMEOUT_SEC:-120}
  REQUEST_MAX_LLM_CALLS: ${REQUEST_MAX_LLM_CALLS:-4}
  REQUEST_MAX_TOOLS: ${REQUEST_MAX_TOOLS:-6}
  REQUEST_MAX_INPUT_BYTES: ${REQUEST_MAX_INPUT_BYTES:-96000}
  REQUEST_MAX_INPUT_TOKENS: ${REQUEST_MAX_INPUT_TOKENS:-24000}
  REQUEST_MAX_COST: ${REQUEST_MAX_COST:-0}
  LLM_INPUT_PRICE_PER_MILLION: ${LLM_INPUT_PRICE_PER_MILLION:-}
  LLM_OUTPUT_PRICE_PER_MILLION: ${LLM_OUTPUT_PRICE_PER_MILLION:-}
  LLM_PRICE_CURRENCY: ${LLM_PRICE_CURRENCY:-RUB}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-7}
  WEB_MAX_AGE_DAYS: ${WEB_MAX_AGE_DAYS:-7}
  QUOTE_MAX_AGE_SEC: ${QUOTE_MAX_AGE_SEC:-345600}
  GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
  GIGACHAT_CA_BUNDLE_FILE: ${CONTAINER_CA_BUNDLE_FILE:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-20}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-None}
  LLM_STRUCTURED_METHOD: ${LLM_STRUCTURED_METHOD:-function_calling}
services:
  init:
    build: .
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      EVOLUTION_REPO_PATH: /evolution
      WORKSPACE_PATH: /app/workspace/runtime
    entrypoint: ["python", "scripts/container_init.py"]
    volumes:
      - "${DEPLOY_WORKSPACE:-./workspace/container}/rag:/app/workspace/rag"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/reports:/app/workspace/reports"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/models:/app/workspace/models"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/init:/app/workspace/runtime"
      - "${EVOLUTION_REPO_PATH:-../evolution}:/evolution"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  analyst:
    build: .
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      <<: *model-environment
      ANALYST_MCP_TOKEN: ${ANALYST_MCP_TOKEN:?Set ANALYST_MCP_TOKEN in .env}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      EVOLUTION_REPO_PATH: /evolution
      BRENT_CACHE_PATH: /app/workspace/prices
      TRACE_PATH: /app/workspace/traces
      SESSION_DB_PATH: /app/workspace/sessions/sessions.sqlite3
      RELEASE_PATH: /releases
    command: ["analyst", "--host", "0.0.0.0", "--port", "8011"]
    ports: ["127.0.0.1:${ANALYST_PORT:-8011}:8011"]
    volumes:
      - "${DEPLOY_WORKSPACE:-./workspace/container}/rag:/app/workspace/rag"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/models:/app/workspace/models:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/prices:/app/workspace/prices"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/traces:/app/workspace/traces"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/sessions:/app/workspace/sessions"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/releases:/releases:ro"
      - "${EVOLUTION_REPO_PATH:-../evolution}:/evolution:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/certificates:/certificates:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/llm:/provider-lock"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8011),timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  evolution:
    build: .
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      <<: *model-environment
      EVOLUTION_MIN_GAIN: ${EVOLUTION_MIN_GAIN:-0.01}
      EVOLUTION_MAX_CANDIDATES: ${EVOLUTION_MAX_CANDIDATES:-2}
      EVOLUTION_EVAL_PATH: ${EVOLUTION_EVAL_PATH:-data/evolution_eval.json}
      EVOLUTION_MCP_TOKEN: ${EVOLUTION_MCP_TOKEN:?Set EVOLUTION_MCP_TOKEN in .env}
      WORKSPACE_PATH: /app/workspace/runtime
      RELEASE_PATH: /releases
      TRACE_PATH: /app/workspace/traces
      EVOLUTION_REPO_PATH: /evolution
    command: ["evolution", "--host", "0.0.0.0", "--port", "8012"]
    ports: ["127.0.0.1:${EVOLUTION_PORT:-8012}:8012"]
    volumes:
      - "${DEPLOY_WORKSPACE:-./workspace/container}/certificates:/certificates:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/llm:/provider-lock"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/evolution-runtime:/app/workspace/runtime"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/traces:/app/workspace/traces:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/rag:/app/workspace/rag"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/models:/app/workspace/models:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/releases:/releases:ro"
      - "${EVOLUTION_REPO_PATH:-../evolution}:/evolution"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8012),timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  ouroboros:
    build:
      context: .
      dockerfile: Dockerfile.native
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    depends_on:
      analyst: {condition: service_healthy}
      evolution: {condition: service_healthy}
    environment:
      <<: *model-environment
      ANALYST_MCP_TOKEN: ${ANALYST_MCP_TOKEN:?Set ANALYST_MCP_TOKEN in .env}
      EVOLUTION_MCP_TOKEN: ${EVOLUTION_MCP_TOKEN:?Set EVOLUTION_MCP_TOKEN in .env}
      ANALYST_MCP_URL: http://analyst:8011/mcp
      EVOLUTION_MCP_URL: http://evolution:8012/mcp
    ports: ["127.0.0.1:${UI_PORT:-8765}:8765"]
    volumes:
      - "${DEPLOY_WORKSPACE:-./workspace/container}/container-native:/runtime"
      - "${EVOLUTION_REPO_PATH:-../evolution}:/evolution:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/certificates:/certificates:ro"
      - "${DEPLOY_WORKSPACE:-./workspace/container}/llm:/provider-lock"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
